{% load static %}

  <!-- Modal chọn ảnh / file từ Media Library để chèn vào Quill editor.
  Include trong template có Quill:
  include "media_library/_modal_media_picker.html"

  Kích hoạt bằng JS (xem quill_media_picker.js):
    window.mlPickerOpen(quillInstance) -->


<style>
/* ── Media Picker Modal ──────────────────────────────────────── */
#modalMediaPicker .modal-dialog { max-width: 860px; }
#modalMediaPicker .modal-body   { padding: .75rem 1rem; }

.mlp-toolbar {
  display: flex;
  gap: .5rem;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: .75rem;
}
.mlp-toolbar .mlp-search {
  flex: 1;
  min-width: 160px;
  max-width: 260px;
}

.mlp-type-tabs { display: flex; gap: .3rem; flex-wrap: wrap; }
.mlp-type-tabs .btn { font-size: .75rem; padding: .2rem .6rem; }

/* Grid */
.mlp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: .6rem;
  max-height: 420px;
  overflow-y: auto;
}

.mlp-item {
  border: 2px solid #e2e8f0;
  border-radius: 7px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  background: #fff;
  display: flex;
  flex-direction: column;
}
.mlp-item:hover          { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
.mlp-item.mlp-selected   { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.25); }

.mlp-thumb {
  width: 100%;
  height: 90px;
  background: #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.mlp-thumb img { width: 100%; height: 100%; object-fit: cover; }
.mlp-thumb .mlp-icon {
  font-size: 1.8rem;
  opacity: .65;
}
.mlp-thumb .mlp-check {
  position: absolute;
  top: 5px; right: 5px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: #2563eb;
  color: #fff;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: .7rem;
}
.mlp-item.mlp-selected .mlp-check { display: flex; }

.mlp-name {
  font-size: .7rem;
  font-weight: 600;
  color: #374151;
  padding: .3rem .4rem .1rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mlp-meta {
  font-size: .65rem;
  color: #9ca3af;
  padding: 0 .4rem .35rem;
}

/* Upload tab */
.mlp-upload-zone {
  border: 2px dashed #93c5fd;
  border-radius: 8px;
  background: #eff6ff;
  text-align: center;
  padding: 1.5rem;
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.mlp-upload-zone:hover,
.mlp-upload-zone.mlp-dz-over { background: #dbeafe; border-color: #3b82f6; }
.mlp-upload-zone input[type=file] { display: none; }

/* Pagination */
.mlp-pager { display: flex; gap: .3rem; justify-content: center; margin-top: .65rem; }
.mlp-pager .btn { font-size: .72rem; padding: .15rem .5rem; }

/* Empty state */
.mlp-empty { text-align: center; padding: 2.5rem; color: #9ca3af; }

/* Loading spinner */
.mlp-spinner {
  display: flex; align-items: center; justify-content: center;
  height: 200px; color: #6b7280;
}

/* Bottom bar */
.mlp-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: .75rem;
  gap: .5rem;
  flex-wrap: wrap;
  border-top: 1px solid #e5e7eb;
  padding-top: .65rem;
}
.mlp-selection-info { font-size: .8rem; color: #6b7280; }
</style>

<!-- Modal -->
<div class="modal" id="modalMediaPicker" tabindex="-1" aria-labelledby="modalMediaPickerLabel">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header py-2">
        <h6 class="modal-title" id="modalMediaPickerLabel">
          <i class="fa fa-photo-video me-1"></i> Chọn từ thư viện Media
        </h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">

        <!-- Tabs: Library / Upload -->
        <ul class="nav nav-tabs nav-sm mb-3" id="mlpTabs">
          <li class="nav-item">
            <button class="nav-link active" data-mlp-tab="library">
              <i class="fa fa-images me-1"></i> Thư viện
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-mlp-tab="upload">
              <i class="fa fa-upload me-1"></i> Upload mới
            </button>
          </li>
        </ul>

        <!-- ── Tab: Library ── -->
        <div id="mlpTabLibrary">
          <div class="mlp-toolbar">
            <input type="text" class="form-control form-control-sm mlp-search"
                   id="mlpSearch" placeholder="Tìm tên file…">
            <div class="mlp-type-tabs">
              <button class="btn btn-primary btn-sm mlp-type-btn active" data-type="">Tất cả</button>
              <button class="btn btn-outline-secondary btn-sm mlp-type-btn" data-type="image">🖼 Ảnh</button>
              <button class="btn btn-outline-secondary btn-sm mlp-type-btn" data-type="pdf">📄 PDF</button>
              <button class="btn btn-outline-secondary btn-sm mlp-type-btn" data-type="docx">📝 Word</button>
              <button class="btn btn-outline-secondary btn-sm mlp-type-btn" data-type="excel">📊 Excel</button>
            </div>
          </div>

          <!-- Grid -->
          <div class="mlp-grid" id="mlpGrid">
            <div class="mlp-spinner"><i class="fa fa-circle-notch fa-spin me-2"></i> Đang tải...</div>
          </div>

          <!-- Pagination -->
          <div class="mlp-pager" id="mlpPager"></div>
        </div>

        <!-- ── Tab: Upload ── -->
        <div id="mlpTabUpload" style="display:none">
          <div class="mlp-upload-zone" id="mlpUploadZone">
            <label style="cursor:pointer;display:block">
              <i class="fa fa-cloud-upload-alt fa-2x text-primary d-block mb-2"></i>
              <strong>Kéo thả file vào đây hoặc bấm để chọn</strong>
              <p class="text-muted mt-1 mb-2" style="font-size:.78rem">
                JPG, PNG, GIF, WebP, PDF, Word, Excel &nbsp;|&nbsp; Tối đa 20MB
              </p>
              <input type="file" id="mlpFileInput" multiple
                     accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.svg,.pdf,.doc,.docx,.xls,.xlsx,.csv">
            </label>
          </div>
          <div id="mlpUploadResult" class="mt-2" style="display:none">
            <div class="progress mb-1" style="height:5px">
              <div class="progress-bar progress-bar-striped progress-bar-animated"
                   id="mlpUploadBar" style="width:0%"></div>
            </div>
            <small id="mlpUploadStatus" class="text-muted"></small>
          </div>
        </div>

      </div><!-- /modal-body -->

      <!-- Footer -->
      <div class="modal-footer py-2" id="mlpFooter">
        <span class="mlp-selection-info" id="mlpSelInfo">Chưa chọn file nào</span>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-sm btn-primary" id="mlpBtnInsert" disabled>
            <i class="fa fa-plus me-1"></i> Chèn vào nội dung
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal sửa ảnh trong Quill -->
<div class="modal" id="modalImageEdit" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:420px">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title"><i class="fa fa-image me-1"></i> Sửa ảnh</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <!-- Preview -->
        <div class="text-center mb-3">
          <img id="imgEditPreview" src="" alt=""
               style="max-width:100%;max-height:180px;object-fit:contain;border:1px solid #e5e7eb;border-radius:6px">
        </div>
        <div class="mb-2">
          <label class="form-label form-label-sm fw-semibold">Alt text</label>
          <input type="text" class="form-control form-control-sm" id="imgEditAlt"
                 placeholder="Mô tả ảnh (cho SEO và accessibility)">
        </div>
        <div class="mb-2">
          <label class="form-label form-label-sm fw-semibold">Chiều rộng</label>
          <div class="input-group input-group-sm">
            <input type="number" class="form-control" id="imgEditWidth"
                   placeholder="Tự động" min="50" max="1200" step="10">
            <span class="input-group-text">px</span>
            <button class="btn btn-outline-secondary" type="button" id="imgEditWidthClear"
                    title="Xóa — dùng chiều rộng tự động">✕ Auto</button>
          </div>
          <div class="form-text">Để trống = chiều rộng tự động (100%)</div>
        </div>
        <div class="mb-2">
          <label class="form-label form-label-sm fw-semibold">Căn lề</label>
          <div class="btn-group btn-group-sm w-100">
            <button class="btn btn-outline-secondary img-align-btn" data-align="">
              <i class="fa fa-align-left"></i> Trái
            </button>
            <button class="btn btn-outline-secondary img-align-btn" data-align="center">
              <i class="fa fa-align-center"></i> Giữa
            </button>
            <button class="btn btn-outline-secondary img-align-btn" data-align="right">
              <i class="fa fa-align-right"></i> Phải
            </button>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label form-label-sm fw-semibold">Link khi bấm vào ảnh</label>
          <input type="url" class="form-control form-control-sm" id="imgEditLink"
                 placeholder="https://...">
        </div>
      </div>
      <div class="modal-footer py-2 gap-2">
        <button class="btn btn-sm btn-outline-danger me-auto" id="imgEditBtnDelete">
          <i class="fa fa-trash me-1"></i> Xóa ảnh
        </button>
        <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button class="btn btn-sm btn-primary" id="imgEditBtnSave">
          <i class="fa fa-check me-1"></i> Áp dụng
        </button>
      </div>
    </div>
  </div>
</div>
