<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Hệ thống quản lý khám sức khỏe{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'booking/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
 
</head>
<body>
<!-- Sidebar Menu -->
{% include "booking/includes/menu.html" %}


<div class="main-content" id="main-content">
 <div class="wrapper">
    {% block content %}{% endblock %}
  </div>
</div>

<!-- Bootstrap JS + Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const mainContent = document.getElementById("main-content");
    sidebar.classList.toggle("collapsed");
    if (window.innerWidth <= 767) {
        const isActive = sidebar.classList.toggle("active");
        if (sidebar.classList.contains("collapsed")) {
            mainContent.style.marginLeft = "0px";
        } else {
            mainContent.style.marginLeft = "220px";
        }
    } else {
        if (sidebar.classList.contains("collapsed")) {
            mainContent.style.marginLeft = "60px";
        } else {
            mainContent.style.marginLeft = "220px";
        }
    }
  }

  function updateSidebarState() {
    const sidebar = document.getElementById("sidebar");
    const mainContent = document.getElementById("main-content");
    const topbar = document.getElementById("topbar");
    const screenWidth = window.innerWidth;

    if (screenWidth < 768) {
      // Mobile: ẩn sidebar, hiện topbar
      sidebar.classList.remove("active");
      sidebar.classList.add("collapsed");
    //   sidebar.style.display = "none";
      topbar.style.display = "flex";
      mainContent.style.marginLeft = "0px";
    } else if (screenWidth >= 768 && screenWidth < 1024) {
      // Tablet: thu gọn sidebar, ẩn topbar
      sidebar.style.display = "block";
      sidebar.classList.add("collapsed");
      sidebar.classList.remove("active");
      topbar.style.display = "none";
      mainContent.style.marginLeft = "60px";
    } else {
      // Desktop: hiển thị đầy đủ
      sidebar.style.display = "block";
      sidebar.classList.remove("collapsed");
      sidebar.classList.remove("active");
      topbar.style.display = "none";
      mainContent.style.marginLeft = "220px";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    updateSidebarState();
  });

  window.addEventListener("resize", updateSidebarState);

  // Ẩn sidebar khi click ra ngoài (chỉ trên mobile)
  document.addEventListener("click", function (event) {
    const sidebar = document.getElementById("sidebar");
    const topbarBtn = document.getElementById("topbar");
    const mainContent = document.getElementById("main-content");

    if (window.innerWidth < 768) {
      const isClickInsideSidebar = sidebar.contains(event.target);
      const isClickToggle = topbarBtn.contains(event.target);

      if (!isClickInsideSidebar && !isClickToggle) {
        if (!sidebar.classList.contains("collapsed")) {
            sidebar.classList.add("collapsed");
            mainContent.style.marginLeft = "0px";
        }
      }
    }
  });
</script>


</body>
</html>
