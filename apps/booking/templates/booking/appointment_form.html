{% extends "base.html" %}


{% block content %}

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">

      <div class="text-center mb-4">
        <h2 class="fw-bold">Tạo thông tin hợp đồng KSK</h2>
      </div>

      <form method="post" action="{% url 'booking:save_appointment' %}" class="bg-light p-4 rounded shadow-sm needs-validation" novalidate>
        {% csrf_token %}

        <div class="row">
          <div class="mb-12">
            <label class="form-label">Tên công ty</label>
            <select name="company_id" class="form-control" required>
              <option value="">-- Chọn công ty --</option>
              {% for company in companies %}
                <option value="{{ company.id }}">{{ company.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- <div class="row">
          <div class="mb-12">
            <label class="form-label">Địa chỉ</label>
            <input type="text" name="company_address" class="form-control">
          </div>
        </div>

        <div class="row">
          <div class="mb-12">
            <label class="form-label">Số điện thoại</label>
            <input type="text" name="company_phone" class="form-control">
          </div>
        </div> -->

        <div class="row">
          <div class="col-12">
              <label class="form-label">Số lượng nhân viên</label>
              <input type="number" name="employee_count" class="form-control" min="1">
          </div>
        </div>
        
        <div class="row">
          <div class="col-12">
            <label class="form-label">Đợt lấy máu</label>
            <table class="table table-bordered" id="blood-collection-table">
              <thead>
                <tr>
                  <th>Ngày lấy máu</th>
                  <th>Địa điểm</th>
                  <th>Số người</th>
                  <th>Số nhân viên</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <tr class="blood-row">
                  <td><input type="date" class="form-control" name="blood_collection_date[]"></td>
                  <td><input type="text" class="form-control" name="blood_location[]"></td>
                  <td><input type="number" class="form-control" min="0" name="blood_people_count[]"></td>
                  <td><input type="number" class="form-control" min="0" name="blood_staff_count[]"></td>
                  <td><button type="button" class="btn btn-danger btn-sm remove-row">🗑️</button></td>
                </tr>
              </tbody>
            </table>
            <button type="button" class="btn btn-secondary btn-sm" id="add-blood-row">+ Thêm dòng</button>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-6 col-md-6 col-sm-6">
            <label class="form-label">Ngày bắt đầu khám</label>
            <input type="date" name="start_date" class="form-control">
          </div>

          <div class="col-lg-6 col-md-6 col-sm-6">
            <label class="form-label">Ngày kết thúc khám</label>
            <input type="date" name="end_date" class="form-control">
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <label class="form-label">Ghi chú</label>
            <textarea name="note" class="form-control" rows="3"></textarea>
          </div>
        </div>

        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-primary">💾 Lưu</button>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('add-blood-row').addEventListener('click', function () {
    let tbody = document.querySelector('#blood-collection-table tbody');
    let newRow = document.createElement('tr');
    newRow.className = 'blood-row';
    newRow.innerHTML = `
      <td><input type="date" class="form-control" name="blood_collection_date[]"></td>
      <td><input type="text" class="form-control" name="blood_location[]"></td>
      <td><input type="number" class="form-control" min="0" name="blood_people_count[]"></td>
      <td><input type="number" class="form-control" min="0" name="blood_staff_count[]"></td>
      <td><button type="button" class="btn btn-danger btn-sm remove-row">🗑️</button></td>
    `;
    tbody.appendChild(newRow);
});

// Sự kiện xóa dòng
document.querySelector('#blood-collection-table tbody').addEventListener('click', function (e) {
    if (e.target.classList.contains('remove-row')) {
        let row = e.target.closest('tr');
        row.parentNode.removeChild(row);
    }
});
</script>

{% endblock %}
