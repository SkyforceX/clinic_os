<aside class="pl-sidebar">

  <div class="pl-sidebar-head">
    <span class="pl-sidebar-title">
      <i class="fa-solid fa-users"></i> Bệnh nhân
    </span>
    <span class="pl-count-badge" id="patientCount"></span>
  </div>

  <div class="pl-sidebar-filters">
    <div class="pl-filter-row" style="display:none">
      <i class="fa-solid fa-building pl-fi"></i>
      <select id="companyFilter" class="pl-filter-select">
        <option value="">Tất cả công ty</option>
        {% for c in companies %}
          <option value="{{ c.id }}" data-value="{{ c.name }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="pl-filter-row">
      <i class="fa-solid fa-magnifying-glass pl-fi"></i>
      <input type="text" id="nameFilter" class="pl-filter-input" placeholder="Tìm họ tên...">
    </div>
    <div class="pl-filter-row">
      <i class="fa-solid fa-id-badge pl-fi"></i>
      <input type="text" id="codeFilter" class="pl-filter-input" placeholder="Tìm mã BN...">
    </div>
  </div>

  <div class="pl-sidebar-list" id="patientContainer"></div>

</aside>
