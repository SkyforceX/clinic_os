<!-- Delete Contract Modal -->
<div class="modal" id="deleteContractModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title text-danger">
          <i class="fa fa-trash"></i> Xác nhận xoá
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p>
          Bạn có chắc muốn xoá lịch khám của
          <strong id="delete-company-name"></strong>?
        </p>
        <p class="text-danger mb-0">
          Thao tác này không thể hoàn tác.
        </p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Huỷ
        </button>

        <button class="btn btn-danger" id="confirm-delete-contract">
          Xoá hợp đồng
        </button>
      </div>

    </div>
  </div>
</div>
