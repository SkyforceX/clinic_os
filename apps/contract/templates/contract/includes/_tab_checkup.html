<div class="tab-pane fade" id="tab-checkup" role="tabpanel" aria-labelledby="tab-checkup-tab">
  <div class="p-2">

    <form id="checkupForm">
      {% csrf_token %}
      <input type="hidden" id="checkup-company-id" name="company_id">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold mb-0">Danh sách bệnh nhân & dịch vụ siêu âm</h6>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="reloadCheckupBtn">
          <i class="fa-solid fa-rotate"></i> Tải lại
        </button>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-light">
          </thead>
          <tbody id="checkupTableBody">
            <tr>
              <td colspan="5" class="text-center py-4 text-muted">
                <i class="fa-solid fa-circle-info"></i> Chưa có dữ liệu. Vui lòng mở tab để tải danh sách.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </form>

  </div>
</div>
<script>
  const AJAX_FETCH_CHECKUPS_URL = "{% url 'contract:ajax_checkup_overview' %}";
</script>
