<!-- Approve Contract Modal -->
<div class="modal" id="approveContractModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title text-success">
          <i class="fa fa-check-circle"></i> Xác nhận chốt hợp đồng
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p>
          Bạn có chắc chắn muốn chốt hợp đồng của
          <strong id="approve-company-name"></strong>?
        </p>
        <p class="text-danger mb-0">
          Sau khi chốt, lịch khám sẽ bị khóa và không thể chỉnh sửa.
        </p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Huỷ
        </button>

        <button class="btn btn-success" id="confirm-approve-contract">
          Chốt HĐ
        </button>
      </div>

    </div>
  </div>
</div>
