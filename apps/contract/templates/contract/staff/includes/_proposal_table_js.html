<!--  _proposal_table_js.html-->
<!--  ========================-->
<!--  Core module: quản lý bảng dịch vụ động trong form tạo/sửa báo giá.-->
<!--  Yêu cầu: CATALOG_JSON phải được khai báo trước khi include file này.-->

<!--  Public API:-->
<!--    addItemToTable(item, opts, skipRecalc)-->
<!--    removeItemFromTable(id)-->
<!--    clearTable()-->
<!--    isItemInTable(id)-->
<!--    getTableItemIds()          → Set of id strings hiện có trong bảng-->
<!---->
<script>
// ═══════════════════════════════════════════════════════════════════════════
// Catalog lookup maps – khởi tạo ngay khi script parse (synchronous)
// ═══════════════════════════════════════════════════════════════════════════

var CATALOG_MAP      = {};   // id (int) → item object
var ITEM_POSITION    = {};   // id (int) → index in CATALOG_JSON (sort order)
var GROUP_ORDER      = [];   // ordered list of unique group names

(function buildCatalogMaps() {
  if (typeof CATALOG_JSON === 'undefined') return;
  CATALOG_JSON.forEach(function(item, idx) {
    CATALOG_MAP[item.id] = item;
    ITEM_POSITION[item.id] = idx;
    var g = item.group || 'Khác';
    if (GROUP_ORDER.indexOf(g) === -1) GROUP_ORDER.push(g);
  });
})();

// ═══════════════════════════════════════════════════════════════════════════
// Row builder – tạo <tr> element cho một catalog item
// ═══════════════════════════════════════════════════════════════════════════

function buildTableRow(item, opts) {
  opts = opts || {};
  var id      = item.id;
  var type    = item.price_type || 'standard';
  var isFree  = type === 'free';
  var isGift  = type === 'gift';

  var forM    = item.for_male          !== false ? 1 : 0;
  var forFs   = item.for_female_single !== false ? 1 : 0;
  var forFf   = item.for_female_family !== false ? 1 : 0;

  // Giá gốc: dùng opts.cat_m/fs/ff nếu có (snapshot override), fallback catalog
  var catM    = opts.cat_m  !== undefined ? opts.cat_m  : (item.price_male          || 0);
  var catFs   = opts.cat_fs !== undefined ? opts.cat_fs : (item.price_female_single || 0);
  var catFf   = opts.cat_ff !== undefined ? opts.cat_ff : (item.price_female_family || 0);

  // Gender checkbox defaults
  var chkM    = opts.checked_male !== undefined ? opts.checked_male : true;
  var chkFs   = opts.checked_fs   !== undefined ? opts.checked_fs   : true;
  var chkFf   = opts.checked_ff   !== undefined ? opts.checked_ff   : true;

  // Row discount % defaults
  var pctM    = opts.pct_male !== undefined ? opts.pct_male : '';
  var pctFs   = opts.pct_fs   !== undefined ? opts.pct_fs   : '';
  var pctFf   = opts.pct_ff   !== undefined ? opts.pct_ff   : '';

  // ── Giá niêm yết cell ────────────────────────────────────────────────────
  var niemyetHtml;
  if (isFree) {
    niemyetHtml = '<span class="text-muted" style="font-size:.75rem">Miễn phí</span>';
  } else if (isGift) {
    niemyetHtml = '<span style="color:#e65100;font-size:.75rem">TẶNG</span>';
  } else {
    niemyetHtml = '<span class="niemyet-display" id="niemyet_' + id + '">–</span>';
  }

  // ── Giá ưu đãi cell (+ hidden price fields) ──────────────────────────────
  var udaiDisplayHtml;
  if (isFree) {
    udaiDisplayHtml = '<span class="udai-free">Miễn phí</span>';
  } else if (isGift) {
    udaiDisplayHtml = '<span class="udai-free" style="color:#e65100">TẶNG</span>';
  } else {
    udaiDisplayHtml = '<span class="udai-display" id="udai_' + id + '">–</span>';
  }
  var udaiHtml = udaiDisplayHtml +
    '<input type="hidden" name="udai_male_' + id + '"  id="h_udai_m_' + id  + '" value="">' +
    '<input type="hidden" name="udai_fs_'   + id + '"  id="h_udai_fs_' + id + '" value="">' +
    '<input type="hidden" name="udai_ff_'   + id + '"  id="h_udai_ff_' + id + '" value="">' +
    '<input type="hidden" name="price_male_'          + id + '" id="h_pm_'  + id + '" value="">' +
    '<input type="hidden" name="price_female_single_' + id + '" id="h_pfs_' + id + '" value="">' +
    '<input type="hidden" name="price_female_family_' + id + '" id="h_pff_' + id + '" value="">';

  // ── Discount % inputs per gender ─────────────────────────────────────────
  function pctCell(gender, pctVal, cssClass) {
    if (isFree || isGift) return '<span class="text-muted" style="font-size:.75rem">–</span>';
    var applies = gender === 'm' ? forM : (gender === 'fs' ? forFs : forFf);
    if (!applies) return '<span class="text-muted">–</span>';
    // name phải khớp với view: pct_male_N / pct_fs_N / pct_ff_N
    // id dùng bởi recalcRow:   pct_m_N   / pct_fs_N / pct_ff_N
    var fieldName = gender === 'm' ? ('pct_male_' + id) : ('pct_' + gender + '_' + id);
    var fieldId   = 'pct_' + gender + '_' + id;
    return '<input type="number" class="row-pct-input ' + cssClass + '" ' +
           'name="' + fieldName + '" id="' + fieldId + '" ' +
           'value="' + (pctVal || '') + '" min="0" max="100" step="0.5" ' +
           'oninput="recalcRow(\'' + id + '\')">';
  }

  // ── Gender checkboxes ─────────────────────────────────────────────────────
  var genderHtml = '<div class="gender-check">';
  if (forM)  genderHtml += '<label title="Nam"><input type="checkbox" name="checked_male_' + id +
    '" class="g-check" ' + (chkM  ? 'checked' : '') +
    ' onchange="recalcRow(\'' + id + '\')"><span style="color:#1a5276;font-size:.75rem">M</span></label>';
  if (forFs) genderHtml += '<label title="Nữ độc thân"><input type="checkbox" name="checked_fs_' + id +
    '" class="g-check" ' + (chkFs ? 'checked' : '') +
    ' onchange="recalcRow(\'' + id + '\')"><span style="color:#6a1b9a;font-size:.75rem">FS</span></label>';
  if (forFf) genderHtml += '<label title="Nữ gia đình"><input type="checkbox" name="checked_ff_' + id +
    '" class="g-check" ' + (chkFf ? 'checked' : '') +
    ' onchange="recalcRow(\'' + id + '\')"><span style="color:#00695c;font-size:.75rem">FF</span></label>';
  genderHtml += '</div>';

  // ── Assemble row ──────────────────────────────────────────────────────────
  var tr = document.createElement('tr');
  tr.className       = 'svc-row';
  tr.dataset.id      = id;
  tr.dataset.catM    = catM;
  tr.dataset.catFs   = catFs;
  tr.dataset.catFf   = catFf;
  tr.dataset.forM    = forM;
  tr.dataset.forFs   = forFs;
  tr.dataset.forFf   = forFf;
  tr.dataset.type    = type;
  tr.dataset.group   = item.group    || 'Khác';
  tr.dataset.subgroup = item.subgroup || '';

  tr.innerHTML =
    // Col 1: STT + hidden selected_ids (for form submission)
    '<td class="stt-col text-center">' +
      '<span class="stt-num"></span>' +
      '<input type="hidden" class="row-check" name="selected_ids" value="' + id + '">' +
    '</td>' +
    // Col 2: Tên dịch vụ
    '<td>' +
      '<div class="fw-semibold" style="font-size:.85rem">' + (item.name || '') + '</div>' +
      (item.description ? '<div class="text-muted" style="font-size:.75rem">' + item.description + '</div>' : '') +
    '</td>' +
    // Col 3: Giá niêm yết
    '<td class="niemyet-cell text-end">' + niemyetHtml + '</td>' +
    // Col 4: Giá ưu đãi + hidden fields
    '<td class="udai-cell text-end">' + udaiHtml + '</td>' +
    // Col 5–7: Discount % per gender
    '<td class="text-center">' + pctCell('m',  pctM,  'pct-m')  + '</td>' +
    '<td class="text-center">' + pctCell('fs', pctFs, 'pct-fs') + '</td>' +
    '<td class="text-center">' + pctCell('ff', pctFf, 'pct-ff') + '</td>' +
    // Col 8: Gender checkboxes
    '<td>' + genderHtml + '</td>' +
    // Col 9: Remove button
    '<td class="text-center">' +
      '<button type="button" class="btn btn-link p-0 text-danger" ' +
              'title="Xóa khỏi báo giá" onclick="removeItemFromTable(' + id + ')" ' +
              'style="font-size:.85rem;line-height:1">' +
        '<i class="fa fa-xmark"></i>' +
      '</button>' +
    '</td>';

  return tr;
}

// ═══════════════════════════════════════════════════════════════════════════
// Group / subgroup header row builders
// ═══════════════════════════════════════════════════════════════════════════

function buildGroupHeaderRow(groupName) {
  var tr       = document.createElement('tr');
  tr.className = 'group-hdr';
  tr.dataset.group    = groupName;
  tr.dataset.subgroup = '';
  tr.innerHTML = '<td colspan="9">' + groupName + '</td>';
  return tr;
}

function buildSubgroupHeaderRow(groupName, subgroupName) {
  var tr       = document.createElement('tr');
  tr.className = 'subgroup-hdr';
  tr.dataset.group    = groupName;
  tr.dataset.subgroup = subgroupName;
  tr.innerHTML = '<td colspan="9">' + subgroupName + '</td>';
  return tr;
}

function normalizeCatalogTableStructure(tbody) {
  if (!tbody) return;

  // Giữ lại đúng thứ tự svc-row hiện có
  var serviceRows = Array.from(tbody.querySelectorAll('.svc-row'));

  // Xóa toàn bộ header cũ để rebuild lại sạch
  tbody.querySelectorAll('.group-hdr, .subgroup-hdr').forEach(function(row) {
    row.remove();
  });

  var seenGroups = new Set();
  var seenSubgroups = new Set();

  serviceRows.forEach(function(row) {
    var groupName = row.dataset.group || 'Khác';
    var subgroupName = row.dataset.subgroup || '';

    if (!seenGroups.has(groupName)) {
      tbody.insertBefore(buildGroupHeaderRow(groupName), row);
      seenGroups.add(groupName);
    }

    if (subgroupName) {
      var subgroupKey = groupName + '||' + subgroupName;
      if (!seenSubgroups.has(subgroupKey)) {
        tbody.insertBefore(buildSubgroupHeaderRow(groupName, subgroupName), row);
        seenSubgroups.add(subgroupKey);
      }
    }
  });
}
// ═══════════════════════════════════════════════════════════════════════════
// Add item to table at correct catalog-order position
// ═══════════════════════════════════════════════════════════════════════════

function addItemToTable(item, opts, skipRecalc) {
  var id = String(item.id);
  if (isItemInTable(id)) return; // đã có trong bảng

  var tbody = document.getElementById('catalogBody');
  if (!tbody) return;

  var tr = buildTableRow(item, opts || {});

  // ── Tìm vị trí chèn đúng theo thứ tự catalog ─────────────────────────────
  var pos         = ITEM_POSITION[item.id];
  if (pos === undefined) pos = 9999;
  var existRows   = tbody.querySelectorAll('.svc-row');
  var insertBefore = null;

  for (var i = 0; i < existRows.length; i++) {
    var rowPos = ITEM_POSITION[parseInt(existRows[i].dataset.id)];
    if (rowPos === undefined) rowPos = 9999;
    if (rowPos > pos) {
      insertBefore = existRows[i];
      break;
    }
  }

  // Chèn svc-row
  if (insertBefore) {
    tbody.insertBefore(tr, insertBefore);
  } else {
    tbody.appendChild(tr);
  }

    // Rebuild lại toàn bộ group/subgroup header theo đúng thứ tự hiện tại
  normalizeCatalogTableStructure(tbody);

  refreshSTTNumbers(tbody);

  if (!skipRecalc) {
    recalcRow(id);
    calcTotals();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// Remove item from table, clean up orphan headers
// ═══════════════════════════════════════════════════════════════════════════

function removeItemFromTable(id) {
  id = String(id);
  var tr = document.querySelector('.svc-row[data-id="' + id + '"]');
  if (!tr) return;

  var groupName    = tr.dataset.group    || '';
  var subgroupName = tr.dataset.subgroup || '';
  tr.remove();

  var tbody = document.getElementById('catalogBody');
  if (!tbody) return;

  normalizeCatalogTableStructure(tbody);
  refreshSTTNumbers(tbody);
  calcTotals();

  // Đồng bộ modal catalog picker nếu đang mở
  var cpCb = document.querySelector('.cp-row-check[data-id="' + id + '"]');
  if (cpCb) {
    cpCb.checked = false;
    if (typeof updateCpBadges === 'function') updateCpBadges();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// Clear entire table
// ═══════════════════════════════════════════════════════════════════════════

function clearTable() {
  var tbody = document.getElementById('catalogBody');
  if (tbody) tbody.innerHTML = '';
  calcTotals();
}

// ═══════════════════════════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════════════════════════

function isItemInTable(id) {
  return !!document.querySelector('.svc-row[data-id="' + String(id) + '"]');
}

function getTableItemIds() {
  var ids = new Set();
  document.querySelectorAll('.svc-row').forEach(function(r) { ids.add(r.dataset.id); });
  return ids;
}

function refreshSTTNumbers(tbody) {
  if (!tbody) tbody = document.getElementById('catalogBody');
  if (!tbody) return;
  var n = 1;
  tbody.querySelectorAll('.svc-row').forEach(function(row) {
    var cell = row.querySelector('.stt-num');
    if (cell) cell.textContent = n++;
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// selectAll: add/remove all catalog items
// ═══════════════════════════════════════════════════════════════════════════

function selectAll(checked) {
  if (checked) {
    if (typeof CATALOG_JSON !== 'undefined') {
      CATALOG_JSON.forEach(function(item) { addItemToTable(item, {}, true); });
      recalcAll();
    }
  } else {
    clearTable();
    if (typeof updateCpBadges === 'function') updateCpBadges();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// Default init for CREATE mode: add free items automatically
// ═══════════════════════════════════════════════════════════════════════════

function initDefaultItems() {
  if (typeof CATALOG_JSON === 'undefined') return;
  CATALOG_JSON.forEach(function(item) {
    if (item.price_type === 'free') {
      addItemToTable(item, {}, true);
    }
  });
  recalcAll();
}
</script>
