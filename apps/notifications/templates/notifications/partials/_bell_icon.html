<!--
  Partial: Bell icon + badge cho navbar/sidebar.
  Include vào base_admin.html:

      {% include "notifications/partials/_bell_icon.html" %}

  Yêu cầu context processor hoặc truyền `unread_notif_count` vào context.
  Dễ nhất: dùng template tag bên dưới (xem notifications/templatetags/).
-->
{% load notifications_tags %}

<a href="{% url 'approvals:my_requests' %}"
   class="notif-bell-link"
   title="Thông báo"
   style="position:relative;display:inline-flex;align-items:center;color:inherit;text-decoration:none">

  <!-- Bell icon (SVG inline để không cần FontAwesome) -->
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
  </svg>

  <!-- Badge — data-count dùng bởi notification.js để init unreadCount -->
  {% unread_notification_count as cnt %}
  <span id="notif-badge"
        class="notif-badge"
        data-count="{{ cnt }}"
        style="
          display:{% if cnt %}inline-flex{% else %}none{% endif %};
          position:absolute;
          top:-6px;right:-8px;
          min-width:18px;height:18px;
          padding:0 4px;
          background:#e24b4a;
          color:#fff;
          border-radius:9px;
          font-size:.68rem;
          font-weight:500;
          align-items:center;
          justify-content:center;
          line-height:1;
        ">{{ cnt }}</span>
</a>

<!-- Toast container — fixed bottom-right, z-index cao hơn modal -->
<div id="notif-toast-container"
     style="
       position:fixed;
       bottom:24px;right:24px;
       z-index:9999;
       display:flex;
       flex-direction:column-reverse;
       align-items:flex-end;
     ">
</div>
