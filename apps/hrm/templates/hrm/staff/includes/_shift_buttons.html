{% comment %}
Include: _shift_buttons.html
Params: day_key (str)
JS selectShift() will set the correct state on DOMContentLoaded.
{% endcomment %}
{% load hrm_tags %}
<input type="hidden" name="shift_{{ day_key }}" id="shift_{{ day_key }}" value="">

<button type="button" class="shift-btn" data-day="{{ day_key }}" data-shift="morning"
        onclick="selectShift('{{ day_key }}', 'morning')">
  ☀ Sáng
</button>
<button type="button" class="shift-btn" data-day="{{ day_key }}" data-shift="afternoon"
        onclick="selectShift('{{ day_key }}', 'afternoon')">
  🌤 Chiều
</button>
<button type="button" class="shift-btn" data-day="{{ day_key }}" data-shift="all_day"
        onclick="selectShift('{{ day_key }}', 'all_day')">
  🌞 Cả ngày
</button>
<button type="button" class="shift-btn" data-day="{{ day_key }}" data-shift="off"
        onclick="selectShift('{{ day_key }}', 'off')">
  – Nghỉ
</button>
