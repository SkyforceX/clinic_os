<div class="patient-list">
  <!-- Dropdown chọn công ty -->
  <select id="companyFilter" style="width: 100%; padding: 6px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc;">
      <option value="">-- Chọn công ty --</option>
      {% for c in companies %}
        <option value="{{ c.id }}" data-value="{{ c.name }}">{{ c.name }}</option>
      {% endfor %}
  </select>
  
  <!-- Ô tìm kiếm -->
  <input type="text" id="nameFilter" placeholder="Tìm theo họ tên..." style="width: 100%; padding: 6px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc;">
  <!-- Ô tìm theo mã BN -->
  <input type="text" id="codeFilter" placeholder="Tìm theo mã BN..." style="width: 100%; padding: 6px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc;">
  <!-- Danh sách bệnh nhân -->
  <div id="patientContainer">
    <!-- Danh sách sẽ được tạo bằng JavaScript -->
  </div>  
</div>
