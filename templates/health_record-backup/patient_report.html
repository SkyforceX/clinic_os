{% extends "base.html" %}

{% load static %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'health_record/css/styles.css' %}">
  <meta name="description" content="Hồ sơ sức khỏe điện tử">
  <style>
    .ehr-row{padding:10px 12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .ehr-row small{color:#666}
    .ehr-actions a{margin-left:8px}
    .pdf-modal-content{position:relative;width:90vw;height:90vh;background:#fff;border-radius:8px;overflow:hidden}
    #pdf-modal-close{position:absolute;right:8px;top:8px;z-index:2;border:none;background:#f2f2f2;padding:6px 10px;border-radius:6px;cursor:pointer}
    #pdf-frame{position:absolute;inset:0;width:100%;height:100%;border:0}
    .ehr-list-item{cursor:pointer}
    .ehr-list-item:hover{background:#f7f7f9}
  </style>
{% endblock %}

{% block content %}

<div class="ehr-page-title">Hồ sơ sức khỏe</div>

<!-- MOBILE TABS -->
<div class="d-md-none px-2 pt-2">
  <ul class="nav nav-pills nav-justified ehr-tabbar" id="ehr-mobile-tabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" data-type="blood" type="button" role="tab" aria-selected="true">
        Xét&nbsp;nghiệm máu
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-type="imaging" type="button" role="tab" aria-selected="false">
        Chẩn&nbsp;đoán hình&nbsp;ảnh
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-type="periodic_book" type="button" role="tab" aria-selected="false">
        Sổ&nbsp;khám định&nbsp;kỳ
      </button>
    </li>
  </ul>
</div>

<div class="ehr-flex-container container-fluid">
  <!-- DESKTOP LEFT LIST -->
  <div class="ehr-left d-none d-md-block">
    <div id="ehr-list" class="pe-md-3">
      <div class="ehr-list-item" data-type="blood">Xét&nbsp;nghiệm máu</div>
      <div class="ehr-list-item" data-type="imaging">Chẩn&nbsp;đoán hình&nbsp;ảnh</div>
      <div class="ehr-list-item" data-type="periodic_book">Sổ&nbsp;khám sức&nbsp;khỏe định&nbsp;kỳ</div>
    </div>
  </div>

  <!-- RIGHT / DETAIL -->
  <div class="ehr-right flex-grow-1">
    <div id="ehr-detail" class="ehr-detail-box">
      <div class="ehr-empty">Chọn một mục để xem chi tiết</div>
    </div>
  </div>
</div>

<!-- Modal xem PDF -->
<div id="pdf-modal" style="display:none; position:fixed; z-index:1000; top:0; left:0; width:100vw; height:100vh; background:rgba(44,54,82,.42); align-items:center; justify-content:center;">
  <div class="pdf-modal-content">
    <button id="pdf-modal-close">X</button>
    <iframe id="pdf-frame" src=""></iframe>
  </div>
</div>
{% endblock %}

{{ reports|safe }}

{% block extra_scripts %}
  <script id="ehr-data" type="application/json">
    {{ reports|safe }}
  </script>
  <script src="{% static 'health_record/js/get_data_files.js' %}"></script>
  <script src="{% static 'health_record/js/mobile_view.js' %}"></script>
{% endblock %}
