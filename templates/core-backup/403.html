<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>403 - Truy cập bị từ chối</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
        }
        .error-container {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(35, 55, 80, 0.10);
            max-width: 420px;
            width: 100%;
            padding: 36px 32px 30px 32px;
            text-align: center;
            animation: fadeIn 0.8s;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 900;
            color: #1976d2;
            letter-spacing: 6px;
            margin-bottom: 4px;
        }
        .error-title {
            font-size: 1.7rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        .error-message {
            color: #757575;
            font-size: 1.09rem;
            margin-bottom: 26px;
        }
        .home-link {
            display: inline-block;
            padding: 9px 20px;
            background: #1976d2;
            color: #fff !important;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.16s;
        }
        .home-link:hover {
            background: #1565c0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(32px);}
            to   { opacity: 1; transform: none;}
        }
        @media (max-width: 600px) {
            .error-container { padding: 20px 8px; }
            .error-code { font-size: 3.5rem;}
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code" style="margin-bottom: 14px;">
            <svg width="85" height="85" viewBox="0 0 85 85" fill="none">
                <circle cx="42.5" cy="42.5" r="38" fill="#fff" stroke="#e53935" stroke-width="8"/>
                <line x1="25" y1="60" x2="60" y2="25" stroke="#e53935" stroke-width="8" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="error-title">Truy cập bị từ chối</div>
        <div class="error-message">
            {% if error_message %}
                <div style="color:#b71c1c; margin-bottom:18px; font-weight:500;">
                    {{ error_message }}
                </div>
            {% endif %}
        </div>
        <a class="home-link" href="/static">Quay về trang chủ</a>
    </div>
</body>
</html>
